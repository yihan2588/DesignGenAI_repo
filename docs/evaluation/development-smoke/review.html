<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FunnyLLM blind review</title><style>body{font:18px/1.55 system-ui;margin:40px auto;padding:0 24px;max-width:1152px;background:#faf8ee;color:#14171c}h1{font-size:40px}section{border-top:1px solid #bbb;padding:32px 0}.arms{display:grid;grid-template-columns:1fr 1fr;gap:24px}img{width:100%;height:auto;display:block;margin:12px 0}select,input,button{font:inherit;padding:12px;border:1px solid #777;border-radius:8px;background:white}label{display:block;margin:12px 0}button{background:#d9ec9b;cursor:pointer}@media(max-width:700px){.arms{grid-template-columns:1fr}}</style><h1>Which set has a take worth keeping?</h1><p>Development review. Rate the complete memes first. Then reveal the request and judge the connection. Do not open the separate blind key until ratings are saved.</p><label>Reviewer code <input id="reviewer" placeholder="Use a pseudonym"></label><main id="tasks"></main><button id="save">Download ratings</button><p id="status" role="status"></p><script>
 const tasks=[{"id":"thought-01","mode":"thought","text":"Me organizing my to-do list instead of doing anything.","arms":[{"label":"A","images":["thought-01-A-1.jpg","thought-01-A-2.jpg","thought-01-A-3.jpg"],"failed":false},{"label":"B","images":["thought-01-B-1.jpg","thought-01-B-2.jpg","thought-01-B-3.jpg"],"failed":false}]},{"id":"thought-02","mode":"thought","text":"A group project teammate taking all the credit.","arms":[{"label":"A","images":["thought-02-A-1.jpg","thought-02-A-2.jpg","thought-02-A-3.jpg"],"failed":false},{"label":"B","images":["thought-02-B-1.jpg","thought-02-B-2.jpg","thought-02-B-3.jpg"],"failed":false}]},{"id":"thought-03","mode":"thought","text":"My laptop fan working harder than I am.","arms":[{"label":"A","images":["thought-03-A-1.jpg","thought-03-A-2.jpg","thought-03-A-3.jpg"],"failed":false},{"label":"B","images":["thought-03-B-1.jpg","thought-03-B-2.jpg","thought-03-B-3.jpg"],"failed":false}]},{"id":"thought-04","mode":"thought","text":"The confidence of a manager who has never used the product.","arms":[{"label":"A","images":["thought-04-A-1.jpg","thought-04-A-2.jpg","thought-04-A-3.jpg"],"failed":false},{"label":"B","images":["thought-04-B-1.jpg","thought-04-B-2.jpg","thought-04-B-3.jpg"],"failed":false}]},{"id":"pic-01","mode":"pic","text":"Taking credit for work I barely understand.","arms":[{"label":"A","images":["pic-01-A-1.jpg","pic-01-A-2.jpg","pic-01-A-3.jpg"],"failed":false},{"label":"B","images":["pic-01-B-1.jpg","pic-01-B-2.jpg","pic-01-B-3.jpg"],"failed":false}]},{"id":"pic-02","mode":"pic","text":"","arms":[{"label":"A","images":["pic-02-A-1.jpg","pic-02-A-2.jpg","pic-02-A-3.jpg"],"failed":false},{"label":"B","images":["pic-02-B-1.jpg","pic-02-B-2.jpg","pic-02-B-3.jpg"],"failed":false}]}],root=document.querySelector('#tasks');
 const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 tasks.forEach(t=>{const section=document.createElement('section');section.dataset.id=t.id;section.innerHTML='<h2>'+esc(t.id)+'</h2><div class="arms">'+t.arms.map(a=>'<div><h3>Set '+a.label+'</h3>'+(a.failed?'<p>No usable result.</p>':a.images.map(src=>'<img src="'+esc(src)+'" alt="Meme option in set '+a.label+'">').join(''))+'</div>').join('')+'</div><label>Funnier set <select name="humor"><option value="">Choose</option><option>A</option><option>B</option><option>Tie</option><option>Neither</option></select></label><details><summary>Reveal the original request</summary><p>'+esc(t.text||'(No spirit provided)')+'</p><label>Better connection <select name="connection"><option value="">Choose</option><option>A</option><option>B</option><option>Tie</option><option>Neither</option></select></label><label>Would keep at least one <select name="keep"><option value="">Choose</option><option>A</option><option>B</option><option>Both</option><option>Neither</option></select></label></details>';root.append(section);});
 document.querySelector('#save').onclick=()=>{const rows=[...root.children].map(s=>({task_id:s.dataset.id,reviewer:document.querySelector('#reviewer').value.trim(),humor:s.querySelector('[name=humor]').value,connection:s.querySelector('[name=connection]').value,keep:s.querySelector('[name=keep]').value}));if(rows.some(r=>!r.reviewer||!r.humor||!r.connection||!r.keep)){document.querySelector('#status').textContent='Complete each rating and enter a reviewer code first.';return;}const url=URL.createObjectURL(new Blob([JSON.stringify(rows,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='ratings.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.querySelector('#status').textContent='Ratings downloaded. Keep the blind key separate until review ends.';};
 </script></html>
